<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 400" role="img" aria-label="架構圖：所有請求先到 Cloudflare Worker；路徑不是 /api/ 開頭的交給 env.ASSETS 靜態資源，是 /api/ 的才執行 Worker 程式碼，處理後台和瀏覽計數" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>
.bg{fill:#ffffff;stroke:#e5e5e5}.t{fill:#1f2330;font-family:"PingFang TC","Noto Sans TC","Noto Sans CJK TC","Microsoft JhengHei",sans-serif}
.mono{font-family:"SFMono-Regular",Menlo,Consolas,"Noto Sans Mono","Noto Sans CJK TC",monospace}
.m{fill:#6b7080}.box{fill:#f4f5f6;stroke:#d9dbe0}.acc{fill:#eef0ff;stroke:#2337ff}.at{fill:#2337ff}.ln{stroke:#9aa0ad;fill:none;stroke-width:1.6}
.ok{fill:#1a8f5a}.bad{fill:#d14343}.okb{fill:#e8f6ef;stroke:#1a8f5a}.badb{fill:#fdeeee;stroke:#d14343}.ah{fill:#9aa0ad}
.dim{fill:#1f2330;opacity:.55}.bar{fill:#2337ff}.bar2{fill:#9aa6ff}.lnb{stroke:#d14343;fill:none;stroke-width:1.6}
@media (prefers-color-scheme:dark){.bg{fill:#161822;stroke:#2d3244}.t{fill:#e6e8ef}.m{fill:#8b8fa0}.box{fill:#1f2230;stroke:#3d4253}.acc{fill:#1d2140;stroke:#7b8cff}.at{fill:#7b8cff}.ln{stroke:#5d6375}.ah{fill:#5d6375}.okb{fill:#13261d}.badb{fill:#2a1617}.ok{fill:#3fbf84}.bad{fill:#f07070}.dim{fill:#000;opacity:.6}.bar{fill:#7b8cff}.bar2{fill:#3d4a99}.lnb{stroke:#f07070}}
</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" class="ah"/></marker></defs>
<rect class="bg" x="1" y="1" width="858" height="398" rx="14"/>
<text class="t" x="32" y="44" font-size="20" font-weight="700">閱讀路徑上沒有我寫的程式碼</text>
<text class="t m" x="32" y="68" font-size="13">Worker 只看網址開頭：不是 /api/ 的請求，全部直接交給靜態資源</text>
<rect class="box" x="32" y="180" width="140" height="64" rx="10" />
<text class="t" x="102" y="208" font-size="13.5" font-weight="700" text-anchor="middle">讀者／後台</text>
<text class="t m" x="102" y="228" font-size="11.5" text-anchor="middle">發出請求</text>
<path class="ln" d="M172 212H220" marker-end="url(#a)" />
<rect class="acc" x="224" y="172" width="190" height="80" rx="10" stroke-width="1.6"/>
<text class="t at" x="319" y="204" font-size="14" font-weight="700" text-anchor="middle">Cloudflare Worker</text>
<text class="t m mono" x="319" y="228" font-size="11.5" text-anchor="middle">startsWith('/api/') ?</text>
<path class="ln" d="M414 196C450 196 450 140 490 140" marker-end="url(#a)" />
<text class="t m" x="452" y="150" font-size="12" font-weight="700">否</text>
<path class="ln" d="M414 228C450 228 450 290 490 290" marker-end="url(#a)" />
<text class="t at" x="452" y="286" font-size="12" font-weight="700">是</text>
<rect class="okb" x="494" y="100" width="334" height="92" rx="10" stroke-width="1.4"/>
<text class="t ok mono" x="512" y="128" font-size="13" font-weight="700">env.ASSETS.fetch(request)</text>
<text class="t" x="512" y="152" font-size="12.5">文章、圖片、樣式：建置好的靜態檔</text>
<text class="t m" x="512" y="174" font-size="12">快取和分發交給 Cloudflare</text>
<rect class="box" x="494" y="244" width="334" height="112" rx="10" />
<text class="t" x="512" y="272" font-size="13.5" font-weight="700">Worker 程式碼</text>
<text class="t" x="512" y="296" font-size="12.5">後台 API：讀寫 GitHub（需要登入）</text>
<text class="t" x="512" y="318" font-size="12.5">瀏覽計數：Cloudflare KV（公開端點）</text>
<text class="t m" x="512" y="340" font-size="12">只在這兩種時候醒過來</text>
</svg>
