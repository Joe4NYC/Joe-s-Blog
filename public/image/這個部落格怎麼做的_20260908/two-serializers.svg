<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 430" role="img" aria-label="架構圖：後台存檔經 worker/lib/frontmatter.ts 產生檔案，建置期由 scripts/normalize-frontmatter.mjs 重新序列化並逐位元組比對，同時確認內文雜湊不變" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>
.bg{fill:#ffffff;stroke:#e5e5e5}.t{fill:#1f2330;font-family:"PingFang TC","Noto Sans TC","Noto Sans CJK TC","Microsoft JhengHei",sans-serif}
.mono{font-family:"SFMono-Regular",Menlo,Consolas,"Noto Sans Mono","Noto Sans CJK TC",monospace}
.m{fill:#6b7080}.box{fill:#f4f5f6;stroke:#d9dbe0}.acc{fill:#eef0ff;stroke:#2337ff}.at{fill:#2337ff}.ln{stroke:#9aa0ad;fill:none;stroke-width:1.6}
.ok{fill:#1a8f5a}.bad{fill:#d14343}.okb{fill:#e8f6ef;stroke:#1a8f5a}.badb{fill:#fdeeee;stroke:#d14343}.ah{fill:#9aa0ad}
.dim{fill:#1f2330;opacity:.55}.bar{fill:#2337ff}.bar2{fill:#9aa6ff}.lnb{stroke:#d14343;fill:none;stroke-width:1.6}
@media (prefers-color-scheme:dark){.bg{fill:#161822;stroke:#2d3244}.t{fill:#e6e8ef}.m{fill:#8b8fa0}.box{fill:#1f2230;stroke:#3d4253}.acc{fill:#1d2140;stroke:#7b8cff}.at{fill:#7b8cff}.ln{stroke:#5d6375}.ah{fill:#5d6375}.okb{fill:#13261d}.badb{fill:#2a1617}.ok{fill:#3fbf84}.bad{fill:#f07070}.dim{fill:#000;opacity:.6}.bar{fill:#7b8cff}.bar2{fill:#3d4a99}.lnb{stroke:#f07070}}
</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" class="ah"/></marker></defs>
<rect class="bg" x="1" y="1" width="858" height="428" rx="14"/>
<text class="t" x="32" y="44" font-size="20" font-weight="700">同一個格式，兩份實作，一個 CI 把關</text>
<text class="t m" x="32" y="68" font-size="13">建置腳本和 Worker 各寫一份序列化器；CI 重新產生每個檔案，差一個位元組就紅</text>
<rect class="box" x="32" y="104" width="370" height="120" rx="10" />
<text class="t mono" x="50" y="132" font-size="13.5" font-weight="700">worker/lib/frontmatter.ts</text>
<text class="t" x="50" y="156" font-size="12.5">跑在邊緣節點：後台存檔時產生檔案</text>
<text class="t m" x="50" y="178" font-size="12">刻意寫小：只認這個 collection 的扁平欄位</text>
<text class="t m" x="50" y="200" font-size="12">遇到別的形狀直接拒絕，不猜</text>
<rect class="box" x="458" y="104" width="370" height="120" rx="10" />
<text class="t mono" x="476" y="132" font-size="13.5" font-weight="700">scripts/normalize-frontmatter.mjs</text>
<text class="t" x="476" y="156" font-size="12.5">Node 建置期：可以用完整的 YAML 解析器</text>
<text class="t m" x="476" y="178" font-size="12">把每篇 frontmatter 用固定格式重新序列化</text>
<text class="t m" x="476" y="200" font-size="12">也是 frontmatter:check 的實作</text>
<path class="ln" d="M217 224V262H400" marker-end="url(#a)" />
<path class="ln" d="M643 224V262H460" marker-end="url(#a)" />
<rect class="bg" x="330" y="248" width="200" height="30" rx="15" />
<text class="t at" x="430" y="268" font-size="12.5" font-weight="700" text-anchor="middle">輸出必須逐位元組相同</text>
<path class="ln" d="M430 278V306" marker-end="url(#a)" />
<rect class="acc" x="140" y="310" width="580" height="90" rx="10" stroke-width="1.6"/>
<text class="t at" x="430" y="338" font-size="14" font-weight="700" text-anchor="middle">CI：重新產生 → 跟原檔比對</text>
<text class="t" x="290" y="368" font-size="12.5" text-anchor="middle">差一個位元組 → 部署中止</text>
<text class="t" x="570" y="368" font-size="12.5" text-anchor="middle">內文雜湊改變 → 直接報錯</text>
<text class="t m" x="430" y="390" font-size="12" text-anchor="middle">欄位順序、引號、縮排：由自律變成硬規則</text>
</svg>
