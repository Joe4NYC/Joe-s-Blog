<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 470" role="img" aria-label="時序圖：手機和電腦都載入版本 v1；電腦先存，雲端變成 v2；手機用 v1 存檔時版本不符，收到 conflict，畫面彈出橫幅讓使用者選擇" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>
.bg{fill:#ffffff;stroke:#e5e5e5}.t{fill:#1f2330;font-family:"PingFang TC","Noto Sans TC","Noto Sans CJK TC","Microsoft JhengHei",sans-serif}
.mono{font-family:"SFMono-Regular",Menlo,Consolas,"Noto Sans Mono","Noto Sans CJK TC",monospace}
.m{fill:#6b7080}.box{fill:#f4f5f6;stroke:#d9dbe0}.acc{fill:#eef0ff;stroke:#2337ff}.at{fill:#2337ff}.ln{stroke:#9aa0ad;fill:none;stroke-width:1.6}
.ok{fill:#1a8f5a}.bad{fill:#d14343}.okb{fill:#e8f6ef;stroke:#1a8f5a}.badb{fill:#fdeeee;stroke:#d14343}.ah{fill:#9aa0ad}
.dim{fill:#1f2330;opacity:.55}.bar{fill:#2337ff}.bar2{fill:#9aa6ff}.lnb{stroke:#d14343;fill:none;stroke-width:1.6}
@media (prefers-color-scheme:dark){.bg{fill:#161822;stroke:#2d3244}.t{fill:#e6e8ef}.m{fill:#8b8fa0}.box{fill:#1f2230;stroke:#3d4253}.acc{fill:#1d2140;stroke:#7b8cff}.at{fill:#7b8cff}.ln{stroke:#5d6375}.ah{fill:#5d6375}.okb{fill:#13261d}.badb{fill:#2a1617}.ok{fill:#3fbf84}.bad{fill:#f07070}.dim{fill:#000;opacity:.6}.bar{fill:#7b8cff}.bar2{fill:#3d4a99}.lnb{stroke:#f07070}}
</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" class="ah"/></marker></defs>
<rect class="bg" x="1" y="1" width="858" height="468" rx="14"/>
<text class="t" x="32" y="44" font-size="20" font-weight="700">手機和電腦同時改：後存的一方不會再默默蓋掉</text>
<text class="t m" x="32" y="68" font-size="13">存檔時附上「我是基於哪個版本」；版本對不上就回 conflict，讓我自己決定</text>
<rect class="box" x="80" y="92" width="140" height="40" rx="10" />
<text class="t" x="150" y="117" font-size="14" font-weight="700" text-anchor="middle">手機</text>
<path class="ln" d="M150 132V440" stroke-dasharray="3 5"/>
<rect class="acc" x="360" y="92" width="140" height="40" rx="10" />
<text class="t at" x="430" y="117" font-size="14" font-weight="700" text-anchor="middle">Google Sheet</text>
<path class="ln" d="M430 132V440" stroke-dasharray="3 5"/>
<rect class="box" x="640" y="92" width="140" height="40" rx="10" />
<text class="t" x="710" y="117" font-size="14" font-weight="700" text-anchor="middle">電腦</text>
<path class="ln" d="M710 132V440" stroke-dasharray="3 5"/>
<path class="ln" d="M430 170H156" marker-end="url(#a)" stroke-dasharray="4 4"/>
<text class="t" x="290.0" y="162" font-size="12" text-anchor="middle">載入：updatedAt = v1</text>
<path class="ln" d="M430 170H704" marker-end="url(#a)" stroke-dasharray="4 4"/>
<text class="t" x="570.0" y="162" font-size="12" text-anchor="middle">載入：updatedAt = v1</text>
<path class="ln" d="M710 226H436" marker-end="url(#a)" />
<text class="t" x="570.0" y="218" font-size="12" text-anchor="middle">save（base = v1）</text>
<rect class="okb" x="366" y="240" width="128" height="30" rx="8" stroke-width="1.2"/>
<text class="t ok" x="430" y="260" font-size="12.5" font-weight="700" text-anchor="middle">寫入 → v2</text>
<path class="ln" d="M150 306H424" marker-end="url(#a)" />
<text class="t" x="290.0" y="298" font-size="12" text-anchor="middle">save（base = v1）</text>
<rect class="badb" x="346" y="320" width="168" height="30" rx="8" stroke-width="1.2"/>
<text class="t bad" x="430" y="340" font-size="12.5" font-weight="700" text-anchor="middle">v1 ≠ v2：不寫入</text>
<path class="ln" d="M430 382H156" marker-end="url(#a)" />
<text class="t bad" x="290.0" y="374" font-size="12" text-anchor="middle">{ ok: false, error: "conflict" }</text>
<rect class="bg" x="40" y="396" width="240" height="52" rx="8" />
<text class="t" x="56" y="418" font-size="12.5" font-weight="700">橫幅：雲端有較新版本</text>
<text class="t m" x="56" y="438" font-size="12">載入雲端版本／以這邊覆蓋</text>
<text class="t m" x="696" y="300" font-size="12" text-anchor="end">寫入區外層再包</text>
<text class="t m" x="696" y="318" font-size="12" text-anchor="end">LockService 腳本鎖</text>
</svg>
