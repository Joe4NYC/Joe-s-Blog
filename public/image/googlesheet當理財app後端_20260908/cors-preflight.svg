<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 400" role="img" aria-label="對比圖：用 application/json 時瀏覽器先送 OPTIONS 預檢，Apps Script 常常處理失敗；用 text/plain 時直接 POST，伺服器用 JSON.parse 讀出內容" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>
.bg{fill:#ffffff;stroke:#e5e5e5}.t{fill:#1f2330;font-family:"PingFang TC","Noto Sans TC","Noto Sans CJK TC","Microsoft JhengHei",sans-serif}
.mono{font-family:"SFMono-Regular",Menlo,Consolas,"Noto Sans Mono","Noto Sans CJK TC",monospace}
.m{fill:#6b7080}.box{fill:#f4f5f6;stroke:#d9dbe0}.acc{fill:#eef0ff;stroke:#2337ff}.at{fill:#2337ff}.ln{stroke:#9aa0ad;fill:none;stroke-width:1.6}
.ok{fill:#1a8f5a}.bad{fill:#d14343}.okb{fill:#e8f6ef;stroke:#1a8f5a}.badb{fill:#fdeeee;stroke:#d14343}.ah{fill:#9aa0ad}
.dim{fill:#1f2330;opacity:.55}.bar{fill:#2337ff}.bar2{fill:#9aa6ff}.lnb{stroke:#d14343;fill:none;stroke-width:1.6}
@media (prefers-color-scheme:dark){.bg{fill:#161822;stroke:#2d3244}.t{fill:#e6e8ef}.m{fill:#8b8fa0}.box{fill:#1f2230;stroke:#3d4253}.acc{fill:#1d2140;stroke:#7b8cff}.at{fill:#7b8cff}.ln{stroke:#5d6375}.ah{fill:#5d6375}.okb{fill:#13261d}.badb{fill:#2a1617}.ok{fill:#3fbf84}.bad{fill:#f07070}.dim{fill:#000;opacity:.6}.bar{fill:#7b8cff}.bar2{fill:#3d4a99}.lnb{stroke:#f07070}}
</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" class="ah"/></marker></defs>
<rect class="bg" x="1" y="1" width="858" height="398" rx="14"/>
<text class="t" x="32" y="44" font-size="20" font-weight="700">同一份 JSON，換個 Content-Type 就不用預檢</text>
<text class="t m" x="32" y="68" font-size="13">application/json 會先發 OPTIONS 預檢；text/plain 屬「簡單請求」，直接 POST</text>
<text class="t bad mono" x="32" y="110" font-size="13" font-weight="700">Content-Type: application/json</text>
<rect class="box" x="32" y="124" width="150" height="70" rx="10" />
<text class="t" x="107" y="164" font-size="14" font-weight="700" text-anchor="middle">瀏覽器</text>
<rect class="box" x="678" y="124" width="150" height="70" rx="10" />
<text class="t" x="753" y="156" font-size="14" font-weight="700" text-anchor="middle">Apps Script</text>
<text class="t m" x="753" y="176" font-size="12" text-anchor="middle">Web App</text>
<rect class="badb" x="250" y="134" width="180" height="50" rx="10" stroke-width="1.4"/>
<text class="t bad" x="340" y="156" font-size="13.5" font-weight="700" text-anchor="middle">OPTIONS 預檢</text>
<text class="t m" x="340" y="174" font-size="11.5" text-anchor="middle">先問伺服器准不准</text>
<path class="ln" d="M182 159H246" marker-end="url(#a)" />
<path class="ln" d="M430 159H520" />
<text class="t bad" x="560" y="164" font-size="14" font-weight="700" text-anchor="middle">✗ 常常失敗</text>
<path class="ln" d="M600 159H674" marker-end="url(#a)" stroke-dasharray="4 4"/>
<text class="t ok mono" x="32" y="254" font-size="13" font-weight="700">Content-Type: text/plain;charset=utf-8</text>
<rect class="box" x="32" y="268" width="150" height="70" rx="10" />
<text class="t" x="107" y="308" font-size="14" font-weight="700" text-anchor="middle">瀏覽器</text>
<rect class="box" x="678" y="268" width="150" height="70" rx="10" />
<text class="t" x="753" y="300" font-size="14" font-weight="700" text-anchor="middle">Apps Script</text>
<text class="t m" x="753" y="320" font-size="12" text-anchor="middle">Web App</text>
<rect class="okb" x="250" y="278" width="340" height="50" rx="10" stroke-width="1.4"/>
<text class="t ok" x="420" y="300" font-size="13.5" font-weight="700" text-anchor="middle">POST 直接送出</text>
<text class="t m mono" x="420" y="318" font-size="11.5" text-anchor="middle">body = JSON.stringify(...)</text>
<path class="ln" d="M182 303H246" marker-end="url(#a)" />
<path class="ln" d="M590 303H674" marker-end="url(#a)" />
<text class="t ok mono" x="828" y="360" font-size="11.5" text-anchor="end">伺服器：JSON.parse(e.postData.contents)</text>
</svg>
