<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 380" role="img" aria-label="示意圖：AJAX 請求先經過 check_ajax_referer 擋住跨站偽造請求，再經過 current_user_can manage_options 擋住已登入的訂閱者，最後才執行 wp_update_post" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>
.bg{fill:#ffffff;stroke:#e5e5e5}.t{fill:#1f2330;font-family:"PingFang TC","Noto Sans TC","Noto Sans CJK TC","Microsoft JhengHei",sans-serif}
.mono{font-family:"SFMono-Regular",Menlo,Consolas,"Noto Sans Mono","Noto Sans CJK TC",monospace}
.m{fill:#6b7080}.box{fill:#f4f5f6;stroke:#d9dbe0}.acc{fill:#eef0ff;stroke:#2337ff}.at{fill:#2337ff}.ln{stroke:#9aa0ad;fill:none;stroke-width:1.6}
.ok{fill:#1a8f5a}.bad{fill:#d14343}.okb{fill:#e8f6ef;stroke:#1a8f5a}.badb{fill:#fdeeee;stroke:#d14343}.ah{fill:#9aa0ad}
.dim{fill:#1f2330;opacity:.55}.bar{fill:#2337ff}.bar2{fill:#9aa6ff}.lnb{stroke:#d14343;fill:none;stroke-width:1.6}
@media (prefers-color-scheme:dark){.bg{fill:#161822;stroke:#2d3244}.t{fill:#e6e8ef}.m{fill:#8b8fa0}.box{fill:#1f2230;stroke:#3d4253}.acc{fill:#1d2140;stroke:#7b8cff}.at{fill:#7b8cff}.ln{stroke:#5d6375}.ah{fill:#5d6375}.okb{fill:#13261d}.badb{fill:#2a1617}.ok{fill:#3fbf84}.bad{fill:#f07070}.dim{fill:#000;opacity:.6}.bar{fill:#7b8cff}.bar2{fill:#3d4a99}.lnb{stroke:#f07070}}
</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" class="ah"/></marker></defs>
<rect class="bg" x="1" y="1" width="858" height="378" rx="14"/>
<text class="t" x="32" y="44" font-size="20" font-weight="700">兩道門，各擋一種人</text>
<text class="t m" x="32" y="68" font-size="13">nonce 擋跨站誘導；權限檢查擋已登入但不該有權的人。只有一道，就有一種人進得來</text>
<rect class="box" x="32" y="150" width="130" height="60" rx="10" />
<text class="t" x="97" y="178" font-size="13.5" font-weight="700" text-anchor="middle">AJAX 請求</text>
<text class="t m" x="97" y="198" font-size="11.5" text-anchor="middle">修一篇文章</text>
<path class="ln" d="M162 180H214" marker-end="url(#a)" />
<rect class="acc" x="218" y="130" width="200" height="100" rx="10" stroke-width="1.6"/>
<text class="t at" x="318" y="162" font-size="14" font-weight="700" text-anchor="middle">第 1 道：nonce</text>
<text class="t m mono" x="318" y="186" font-size="11.5" text-anchor="middle">check_ajax_referer()</text>
<text class="t" x="318" y="210" font-size="12.5" font-weight="700" text-anchor="middle">擋 CSRF</text>
<path class="ln" d="M418 180H470" marker-end="url(#a)" />
<rect class="acc" x="474" y="130" width="200" height="100" rx="10" stroke-width="1.6"/>
<text class="t at" x="574" y="162" font-size="14" font-weight="700" text-anchor="middle">第 2 道：權限</text>
<text class="t m mono" x="574" y="186" font-size="10.5" text-anchor="middle">current_user_can('manage_options')</text>
<text class="t" x="574" y="210" font-size="12.5" font-weight="700" text-anchor="middle">擋權限不足</text>
<path class="ln" d="M674 180H708" marker-end="url(#a)" />
<rect class="okb" x="712" y="150" width="116" height="60" rx="10" stroke-width="1.4"/>
<text class="t ok mono" x="770" y="178" font-size="11.5" font-weight="700" text-anchor="middle">wp_update_post</text>
<text class="t m" x="770" y="198" font-size="11.5" text-anchor="middle">真的改文章</text>
<path class="lnb" d="M318 300V238" />
<path d="M312 246L318 236L324 246" class="lnb"/>
<rect class="badb" x="198" y="300" width="240" height="46" rx="8" stroke-width="1.2"/>
<text class="t bad" x="318" y="328" font-size="12" text-anchor="middle">別的網站誘導管理員發出的請求</text>
<path class="lnb" d="M574 300V238" />
<path d="M568 246L574 236L580 246" class="lnb"/>
<rect class="badb" x="454" y="300" width="240" height="46" rx="8" stroke-width="1.2"/>
<text class="t bad" x="574" y="328" font-size="12" text-anchor="middle">已登入的訂閱者直接打端點</text>
</svg>
