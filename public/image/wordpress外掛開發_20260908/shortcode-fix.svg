<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 440" role="img" aria-label="流程圖：兩種壞掉的 pdfjs-viewer 短碼，一種多了黏住的 attachment_id，一種 url 被轉成 Markdown 連結；先用 preg_replace_callback 切出短碼，再依次刪 attachment_id、修 url，得到正確的短碼" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>
.bg{fill:#ffffff;stroke:#e5e5e5}.t{fill:#1f2330;font-family:"PingFang TC","Noto Sans TC","Noto Sans CJK TC","Microsoft JhengHei",sans-serif}
.mono{font-family:"SFMono-Regular",Menlo,Consolas,"Noto Sans Mono","Noto Sans CJK TC",monospace}
.m{fill:#6b7080}.box{fill:#f4f5f6;stroke:#d9dbe0}.acc{fill:#eef0ff;stroke:#2337ff}.at{fill:#2337ff}.ln{stroke:#9aa0ad;fill:none;stroke-width:1.6}
.ok{fill:#1a8f5a}.bad{fill:#d14343}.okb{fill:#e8f6ef;stroke:#1a8f5a}.badb{fill:#fdeeee;stroke:#d14343}.ah{fill:#9aa0ad}
.dim{fill:#1f2330;opacity:.55}.bar{fill:#2337ff}.bar2{fill:#9aa6ff}.lnb{stroke:#d14343;fill:none;stroke-width:1.6}
@media (prefers-color-scheme:dark){.bg{fill:#161822;stroke:#2d3244}.t{fill:#e6e8ef}.m{fill:#8b8fa0}.box{fill:#1f2230;stroke:#3d4253}.acc{fill:#1d2140;stroke:#7b8cff}.at{fill:#7b8cff}.ln{stroke:#5d6375}.ah{fill:#5d6375}.okb{fill:#13261d}.badb{fill:#2a1617}.ok{fill:#3fbf84}.bad{fill:#f07070}.dim{fill:#000;opacity:.6}.bar{fill:#7b8cff}.bar2{fill:#3d4a99}.lnb{stroke:#f07070}}
</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" class="ah"/></marker></defs>
<rect class="bg" x="1" y="1" width="858" height="438" rx="14"/>
<text class="t" x="32" y="44" font-size="20" font-weight="700">先切出短碼，再無條件洗兩次</text>
<text class="t m" x="32" y="68" font-size="13">不判斷「這篇是哪一種壞法」：兩段替換都跑，沒中就原樣返回</text>
<text class="t m" x="32" y="108" font-size="12">資料庫裡的兩種壞法（示意）</text>
<rect class="badb" x="32" y="120" width="796" height="46" rx="8" stroke-width="1.2"/>
<text class="t bad mono" x="48" y="148" font-size="12.5">[pdfjs-viewer url="https://example.com/file.pdf"attachment_id="123" ...]</text>
<rect class="badb" x="32" y="176" width="796" height="46" rx="8" stroke-width="1.2"/>
<text class="t bad mono" x="48" y="204" font-size="12.5">[pdfjs-viewer url="[https://example.com/file.pdf"](https://example.com/file.pdf%22 ...)]</text>
<path class="ln" d="M430 222V250" marker-end="url(#a)" />
<rect class="acc" x="32" y="254" width="252" height="66" rx="10" />
<text class="t at mono" x="50" y="282" font-size="13.5" font-weight="700">preg_replace_callback</text>
<text class="t m" x="50" y="304" font-size="12.5">切出每一個 [pdfjs-viewer …]</text>
<path class="ln" d="M284 287H300" marker-end="url(#a)" />
<rect class="box" x="304" y="254" width="252" height="66" rx="10" />
<text class="t" x="322" y="282" font-size="13.5" font-weight="700">第 1 段替換</text>
<text class="t m" x="322" y="304" font-size="12.5">刪掉 attachment_id</text>
<path class="ln" d="M556 287H572" marker-end="url(#a)" />
<rect class="box" x="576" y="254" width="252" height="66" rx="10" />
<text class="t" x="594" y="282" font-size="13.5" font-weight="700">第 2 段替換</text>
<text class="t m" x="594" y="304" font-size="12.5">Markdown 連結 → url="…"</text>
<text class="t m" x="430" y="342" font-size="12" text-anchor="middle">引號同時接受 " “ ”（wptexturize 會把直引號換成彎引號）；空白用 [\p{Z}\s]</text>
<path class="ln" d="M430 352V372" marker-end="url(#a)" />
<rect class="okb" x="32" y="376" width="796" height="46" rx="8" stroke-width="1.4"/>
<text class="t ok mono" x="48" y="404" font-size="12.5" font-weight="700">[pdfjs-viewer url="https://example.com/file.pdf" ...]</text>
</svg>
