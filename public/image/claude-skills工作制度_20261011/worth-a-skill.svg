<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 400" role="img" aria-label="流程圖：判斷是否值得寫成 skill 的四個問題，依次是重複三次以上、沒有重疊、來源可信、試用一星期" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>
.bg{fill:#ffffff;stroke:#e5e5e5}.t{fill:#1f2330;font-family:"PingFang TC","Noto Sans TC","Noto Sans CJK TC","Microsoft JhengHei",sans-serif}
.mono{font-family:"SFMono-Regular",Menlo,Consolas,"Noto Sans Mono","Noto Sans CJK TC",monospace}
.m{fill:#6b7080}.box{fill:#f4f5f6;stroke:#d9dbe0}.acc{fill:#eef0ff;stroke:#2337ff}.at{fill:#2337ff}.ln{stroke:#9aa0ad;fill:none;stroke-width:1.6}
.ok{fill:#1a8f5a}.bad{fill:#d14343}.okb{fill:#e8f6ef;stroke:#1a8f5a}.badb{fill:#fdeeee;stroke:#d14343}.ah{fill:#9aa0ad}
.dim{fill:#1f2330;opacity:.55}.bar{fill:#2337ff}.bar2{fill:#9aa6ff}.lnb{stroke:#d14343;fill:none;stroke-width:1.6}
@media (prefers-color-scheme:dark){.bg{fill:#161822;stroke:#2d3244}.t{fill:#e6e8ef}.m{fill:#8b8fa0}.box{fill:#1f2230;stroke:#3d4253}.acc{fill:#1d2140;stroke:#7b8cff}.at{fill:#7b8cff}.ln{stroke:#5d6375}.ah{fill:#5d6375}.okb{fill:#13261d}.badb{fill:#2a1617}.ok{fill:#3fbf84}.bad{fill:#f07070}.dim{fill:#000;opacity:.6}.bar{fill:#7b8cff}.bar2{fill:#3d4a99}.lnb{stroke:#f07070}}
</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" class="ah"/></marker></defs>
<rect class="bg" x="1" y="1" width="858" height="398" rx="14"/>
<text class="t" x="32" y="44" font-size="20" font-weight="700">什麼值得寫成（或裝成）一個 skill</text>
<text class="t m" x="32" y="68" font-size="13">四關都過了才留下；任何一關不過就不寫、不裝</text>
<rect class="box" x="32" y="112" width="180" height="96" rx="10" />
<circle cx="56" cy="136" r="12" class="acc" stroke-width="1.4"/>
<text class="t at" x="56" y="141" font-size="12.5" font-weight="700" text-anchor="middle">1</text>
<text class="t" x="48" y="174" font-size="14" font-weight="700">重複做過三次以上？</text>
<text class="t m" x="48" y="196" font-size="12">過去一兩個月</text>
<path class="ln" d="M212 160H230" marker-end="url(#a)" />
<path class="ln" d="M122 208V262" marker-end="url(#a)" />
<text class="t bad" x="130" y="240" font-size="12" font-weight="700">否</text>
<rect class="badb" x="32" y="266" width="180" height="46" rx="10" stroke-width="1.2"/>
<text class="t bad" x="122" y="294" font-size="12.5" text-anchor="middle">只做過一次：不用寫</text>
<rect class="box" x="232" y="112" width="180" height="96" rx="10" />
<circle cx="256" cy="136" r="12" class="acc" stroke-width="1.4"/>
<text class="t at" x="256" y="141" font-size="12.5" font-weight="700" text-anchor="middle">2</text>
<text class="t" x="248" y="174" font-size="14" font-weight="700">跟現有 skill 不重疊？</text>
<text class="t m" x="248" y="196" font-size="12">免得互相打架</text>
<path class="ln" d="M412 160H430" marker-end="url(#a)" />
<path class="ln" d="M322 208V262" marker-end="url(#a)" />
<text class="t bad" x="330" y="240" font-size="12" font-weight="700">否</text>
<rect class="badb" x="232" y="266" width="180" height="46" rx="10" stroke-width="1.2"/>
<text class="t bad" x="322" y="294" font-size="12.5" text-anchor="middle">重疊：不裝</text>
<rect class="box" x="432" y="112" width="180" height="96" rx="10" />
<circle cx="456" cy="136" r="12" class="acc" stroke-width="1.4"/>
<text class="t at" x="456" y="141" font-size="12.5" font-weight="700" text-anchor="middle">3</text>
<text class="t" x="448" y="174" font-size="14" font-weight="700">來源可信？</text>
<text class="t m" x="448" y="196" font-size="12">先讀一次 SKILL.md</text>
<path class="ln" d="M612 160H630" marker-end="url(#a)" />
<path class="ln" d="M522 208V262" marker-end="url(#a)" />
<text class="t bad" x="530" y="240" font-size="12" font-weight="700">否</text>
<rect class="badb" x="432" y="266" width="180" height="46" rx="10" stroke-width="1.2"/>
<text class="t bad" x="522" y="294" font-size="12.5" text-anchor="middle">有可疑指示：不裝</text>
<rect class="box" x="632" y="112" width="180" height="96" rx="10" />
<circle cx="656" cy="136" r="12" class="acc" stroke-width="1.4"/>
<text class="t at" x="656" y="141" font-size="12.5" font-weight="700" text-anchor="middle">4</text>
<text class="t" x="648" y="174" font-size="14" font-weight="700">試用一星期有用？</text>
<text class="t m" x="648" y="196" font-size="12">一次只裝一個</text>
<path class="ln" d="M722 208V262" marker-end="url(#a)" />
<text class="t bad" x="730" y="240" font-size="12" font-weight="700">否</text>
<rect class="badb" x="632" y="266" width="180" height="46" rx="10" stroke-width="1.2"/>
<text class="t bad" x="722" y="294" font-size="12.5" text-anchor="middle">沒用：移除</text>
<rect class="okb" x="632" y="334" width="180" height="44" rx="10" stroke-width="1.4"/>
<text class="t ok" x="722" y="361" font-size="13.5" font-weight="700" text-anchor="middle">全部通過：留下</text>
<path class="ln" d="M812 160H830V356H816" marker-end="url(#a)" />
</svg>
