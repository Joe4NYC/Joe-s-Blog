<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 400" role="img" aria-label="示意圖：AI 平時只看到三個 skill 的一句描述，任務相關時才讀入整份 SKILL.md" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>
.bg{fill:#ffffff;stroke:#e5e5e5}.t{fill:#1f2330;font-family:"PingFang TC","Noto Sans TC","Noto Sans CJK TC","Microsoft JhengHei",sans-serif}
.mono{font-family:"SFMono-Regular",Menlo,Consolas,"Noto Sans Mono","Noto Sans CJK TC",monospace}
.m{fill:#6b7080}.box{fill:#f4f5f6;stroke:#d9dbe0}.acc{fill:#eef0ff;stroke:#2337ff}.at{fill:#2337ff}.ln{stroke:#9aa0ad;fill:none;stroke-width:1.6}
.ok{fill:#1a8f5a}.bad{fill:#d14343}.okb{fill:#e8f6ef;stroke:#1a8f5a}.badb{fill:#fdeeee;stroke:#d14343}.ah{fill:#9aa0ad}
.dim{fill:#1f2330;opacity:.55}.bar{fill:#2337ff}.bar2{fill:#9aa6ff}.lnb{stroke:#d14343;fill:none;stroke-width:1.6}
@media (prefers-color-scheme:dark){.bg{fill:#161822;stroke:#2d3244}.t{fill:#e6e8ef}.m{fill:#8b8fa0}.box{fill:#1f2230;stroke:#3d4253}.acc{fill:#1d2140;stroke:#7b8cff}.at{fill:#7b8cff}.ln{stroke:#5d6375}.ah{fill:#5d6375}.okb{fill:#13261d}.badb{fill:#2a1617}.ok{fill:#3fbf84}.bad{fill:#f07070}.dim{fill:#000;opacity:.6}.bar{fill:#7b8cff}.bar2{fill:#3d4a99}.lnb{stroke:#f07070}}
</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" class="ah"/></marker></defs>
<rect class="bg" x="1" y="1" width="858" height="398" rx="14"/>
<text class="t" x="32" y="44" font-size="20" font-weight="700">Skill 平時只佔一句話</text>
<text class="t m" x="32" y="68" font-size="13">AI 每次只看到每個 skill 的描述；判斷任務相關，才把整份 SKILL.md 讀進來</text>
<text class="t m" x="32" y="108" font-size="12">平時看得到的：每個 skill 一句描述</text>
<rect class="acc" x="32" y="122" width="330" height="64" rx="10" />
<text class="t at mono" x="50" y="149" font-size="15" font-weight="700">work-hq</text>
<text class="t m" x="50" y="171" font-size="12.5">超過三個步驟的任務，開工前先讀</text>
<rect class="box" x="32" y="202" width="330" height="64" rx="10" />
<text class="t mono" x="50" y="229" font-size="15" font-weight="700">exam-revision</text>
<text class="t m" x="50" y="251" font-size="12.5">提到溫習、考試、past paper 時用</text>
<rect class="box" x="32" y="282" width="330" height="64" rx="10" />
<text class="t mono" x="50" y="309" font-size="15" font-weight="700">blog-scout</text>
<text class="t m" x="50" y="331" font-size="12.5">問「值得寫 blog 嗎」時用</text>
<path class="ln" d="M362 154H430" marker-end="url(#a)" />
<text class="t m" x="470" y="140" font-size="12.5" text-anchor="middle">任務相關？</text>
<path class="ln" d="M510 154H548" marker-end="url(#a)" />
<rect class="box" x="552" y="104" width="276" height="262" rx="8" />
<text class="t mono" x="572" y="134" font-size="13" font-weight="700">work-hq / SKILL.md</text>
<text class="t m" x="572" y="156" font-size="12">相關時才讀全文</text>
<rect class="bg" x="572" y="172" width="236" height="30" rx="6" />
<text class="t" x="586" y="192" font-size="12.5">六條硬規則</text>
<rect class="bg" x="572" y="212" width="236" height="30" rx="6" />
<text class="t" x="586" y="232" font-size="12.5">「什麼才算完成」清單</text>
<rect class="bg" x="572" y="252" width="236" height="30" rx="6" />
<text class="t" x="586" y="272" font-size="12.5">踩坑記錄（情境 → 錯誤 → 修正）</text>
<rect class="bg" x="572" y="292" width="236" height="30" rx="6" />
<text class="t" x="586" y="312" font-size="12.5">重試上限：同一件事最多兩輪</text>
<text class="t m" x="690" y="352" font-size="12" text-anchor="middle">……</text>
</svg>
