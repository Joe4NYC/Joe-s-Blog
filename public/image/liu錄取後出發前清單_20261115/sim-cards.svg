<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 350" role="img" aria-label="比較圖：左邊數據卡，出發前已買，每月 20GB，負責上網，沒有瑞典號碼；右邊本地預付卡 kontantkort，有瑞典號碼，負責 BankID、Swish 和各種登記，估算六個月約 175 至 225 瑞典克朗，比月費計劃便宜很多">
<style>
.bg{fill:#ffffff;stroke:#e5e5e5}.t{fill:#1f2330;font-family:"PingFang TC","Noto Sans TC","Noto Sans CJK TC","Microsoft JhengHei",sans-serif}
.m{fill:#6b7080}.box{fill:#f4f5f6;stroke:#d9dbe0}.acc{fill:#eef0ff;stroke:#2337ff}.at{fill:#2337ff}.ln{stroke:#9aa0ad;fill:none;stroke-width:1.6}
.ok{fill:#1a8f5a}.bad{fill:#d14343}.okb{fill:#e8f6ef;stroke:#1a8f5a}.badb{fill:#fdeeee;stroke:#d14343}.ah{fill:#9aa0ad}
@media (prefers-color-scheme:dark){.bg{fill:#161822;stroke:#2d3244}.t{fill:#e6e8ef}.m{fill:#8b8fa0}.box{fill:#1f2230;stroke:#3d4253}.acc{fill:#1d2140;stroke:#7b8cff}.at{fill:#7b8cff}.ln{stroke:#5d6375}.ah{fill:#5d6375}.okb{fill:#13261d}.badb{fill:#2a1617}.ok{fill:#3fbf84}.bad{fill:#f07070}}
</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" class="ah"/></marker></defs>
<rect class="bg" x="1" y="1" width="858" height="348" rx="14"/>
<text class="t" x="32" y="44" font-size="20" font-weight="700">瑞典電話卡：兩張卡分工</text>
<text class="t m" x="32" y="68" font-size="13">數據和本地號碼分開處理</text>
<rect class="box" x="40" y="96" width="370" height="190" rx="10"/>
<text class="t" x="225" y="132" font-size="17" text-anchor="middle" font-weight="700">數據卡</text>
<text class="t m" x="225" y="156" font-size="13" text-anchor="middle">出發前已買</text>
<text class="t" x="225" y="196" font-size="14" text-anchor="middle">每月 20GB</text>
<text class="t" x="225" y="224" font-size="14" text-anchor="middle">負責：上網</text>
<text class="t bad" x="225" y="254" font-size="13.5" text-anchor="middle">沒有瑞典號碼</text>
<rect class="acc" x="450" y="96" width="370" height="190" rx="10"/>
<text class="t at" x="635" y="132" font-size="17" text-anchor="middle" font-weight="700">本地預付卡（kontantkort）</text>
<text class="t m" x="635" y="156" font-size="13" text-anchor="middle">有瑞典號碼</text>
<text class="t" x="635" y="196" font-size="14" text-anchor="middle">負責：BankID、Swish、各種登記</text>
<text class="t" x="635" y="224" font-size="14" text-anchor="middle">估算六個月約 175–225 瑞典克朗</text>
<text class="t ok" x="635" y="254" font-size="13.5" text-anchor="middle">比月費計劃便宜很多</text>
<text class="t m" x="430" y="318" font-size="13" text-anchor="middle">一張負責上網，一張負責要本地號碼的服務</text>
</svg>
