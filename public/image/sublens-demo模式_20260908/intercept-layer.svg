<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 430" role="img" aria-label="架構圖：新增、編輯、暫停、封存、刪除、讀匯率全部經過 apiFetch；Demo 模式改走 demoFetch 讀寫 localStorage，否則照舊呼叫 Apps Script" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>
.bg{fill:#ffffff;stroke:#e5e5e5}.t{fill:#1f2330;font-family:"PingFang TC","Noto Sans TC","Noto Sans CJK TC","Microsoft JhengHei",sans-serif}
.mono{font-family:"SFMono-Regular",Menlo,Consolas,"Noto Sans Mono","Noto Sans CJK TC",monospace}
.m{fill:#6b7080}.box{fill:#f4f5f6;stroke:#d9dbe0}.acc{fill:#eef0ff;stroke:#2337ff}.at{fill:#2337ff}.ln{stroke:#9aa0ad;fill:none;stroke-width:1.6}
.ok{fill:#1a8f5a}.bad{fill:#d14343}.okb{fill:#e8f6ef;stroke:#1a8f5a}.badb{fill:#fdeeee;stroke:#d14343}.ah{fill:#9aa0ad}
.dim{fill:#1f2330;opacity:.55}.bar{fill:#2337ff}.bar2{fill:#9aa6ff}.lnb{stroke:#d14343;fill:none;stroke-width:1.6}
@media (prefers-color-scheme:dark){.bg{fill:#161822;stroke:#2d3244}.t{fill:#e6e8ef}.m{fill:#8b8fa0}.box{fill:#1f2230;stroke:#3d4253}.acc{fill:#1d2140;stroke:#7b8cff}.at{fill:#7b8cff}.ln{stroke:#5d6375}.ah{fill:#5d6375}.okb{fill:#13261d}.badb{fill:#2a1617}.ok{fill:#3fbf84}.bad{fill:#f07070}.dim{fill:#000;opacity:.6}.bar{fill:#7b8cff}.bar2{fill:#3d4a99}.lnb{stroke:#f07070}}
</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" class="ah"/></marker></defs>
<rect class="bg" x="1" y="1" width="858" height="428" rx="14"/>
<text class="t" x="32" y="44" font-size="20" font-weight="700">假後端只接在一個地方</text>
<text class="t m" x="32" y="68" font-size="13">所有讀寫都經過 api.js 的 apiFetch()；Demo 模式在這裡分岔，其他模組一行不改</text>
<rect class="box" x="32" y="104" width="120" height="36" rx="8" />
<text class="t" x="92" y="127" font-size="13" text-anchor="middle">新增</text>
<path class="ln" d="M152 122C200 122 200 236 252 236" marker-end="url(#a)" />
<rect class="box" x="32" y="154" width="120" height="36" rx="8" />
<text class="t" x="92" y="177" font-size="13" text-anchor="middle">編輯</text>
<path class="ln" d="M152 172C200 172 200 236 252 236" marker-end="url(#a)" />
<rect class="box" x="32" y="204" width="120" height="36" rx="8" />
<text class="t" x="92" y="227" font-size="13" text-anchor="middle">暫停</text>
<path class="ln" d="M152 222C200 222 200 236 252 236" marker-end="url(#a)" />
<rect class="box" x="32" y="254" width="120" height="36" rx="8" />
<text class="t" x="92" y="277" font-size="13" text-anchor="middle">封存</text>
<path class="ln" d="M152 272C200 272 200 236 252 236" marker-end="url(#a)" />
<rect class="box" x="32" y="304" width="120" height="36" rx="8" />
<text class="t" x="92" y="327" font-size="13" text-anchor="middle">刪除</text>
<path class="ln" d="M152 322C200 322 200 236 252 236" marker-end="url(#a)" />
<rect class="box" x="32" y="354" width="120" height="36" rx="8" />
<text class="t" x="92" y="377" font-size="13" text-anchor="middle">讀匯率</text>
<path class="ln" d="M152 372C200 372 200 236 252 236" marker-end="url(#a)" />
<rect class="acc" x="256" y="206" width="170" height="60" rx="10" stroke-width="1.6"/>
<text class="t at mono" x="341" y="232" font-size="15" font-weight="700" text-anchor="middle">apiFetch()</text>
<text class="t m" x="341" y="252" font-size="11.5" text-anchor="middle">api.js · 唯一出口</text>
<path class="ln" d="M426 236H470" marker-end="url(#a)" />
<rect class="bg" x="474" y="212" width="120" height="48" rx="24" />
<text class="t mono" x="534" y="241" font-size="12" text-anchor="middle">isDemoMode()</text>
<path class="ln" d="M534 212V150H606" marker-end="url(#a)" />
<text class="t ok" x="546" y="182" font-size="12" font-weight="700">是</text>
<path class="ln" d="M534 260V322H606" marker-end="url(#a)" />
<text class="t m" x="546" y="300" font-size="12" font-weight="700">否</text>
<rect class="okb" x="610" y="118" width="218" height="64" rx="10" stroke-width="1.4"/>
<text class="t ok mono" x="628" y="145" font-size="14" font-weight="700">demoFetch()</text>
<text class="t m" x="628" y="166" font-size="12">讀寫 localStorage，不發請求</text>
<rect class="box" x="610" y="290" width="218" height="64" rx="10" />
<text class="t" x="628" y="317" font-size="14" font-weight="700">fetch → Apps Script</text>
<text class="t m" x="628" y="338" font-size="12">→ Google Sheet（原本的路）</text>
<text class="t m" x="430" y="402" font-size="12.5" text-anchor="middle">兩邊回傳形狀一模一樣：讀取回陣列，寫入回 { success: true }，出錯回 { error }</text>
</svg>
