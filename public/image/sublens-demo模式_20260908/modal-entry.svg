<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 430" role="img" aria-label="對比示意：第一版的 Demo 入口在頁頂橫幅，被 Token 彈窗蓋住；修正後 Demo 按鈕放進彈窗本身" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
