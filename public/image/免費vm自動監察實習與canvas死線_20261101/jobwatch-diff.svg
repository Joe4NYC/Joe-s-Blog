<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 360" role="img" aria-label="jobwatch 比對流程：上次和今次的職位清單比對，只把新出現的職位推去 Telegram" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>
.bg{fill:#ffffff;stroke:#e5e5e5}.t{fill:#1f2330;font-family:"PingFang TC","Noto Sans TC","Noto Sans CJK TC","Microsoft JhengHei",sans-serif}
.m{fill:#6b7080}.box{fill:#f4f5f6;stroke:#d9dbe0}.acc{fill:#eef0ff;stroke:#2337ff}.at{fill:#2337ff}.ln{stroke:#9aa0ad;fill:none;stroke-width:1.6}
.ok{fill:#1a8f5a}.bad{fill:#d14343}.okb{fill:#e8f6ef;stroke:#1a8f5a}.badb{fill:#fdeeee;stroke:#d14343}.ah{fill:#9aa0ad}
@media (prefers-color-scheme:dark){.bg{fill:#161822;stroke:#2d3244}.t{fill:#e6e8ef}.m{fill:#8b8fa0}.box{fill:#1f2230;stroke:#3d4253}.acc{fill:#1d2140;stroke:#7b8cff}.at{fill:#7b8cff}.ln{stroke:#5d6375}.ah{fill:#5d6375}.okb{fill:#13261d}.badb{fill:#2a1617}.ok{fill:#3fbf84}.bad{fill:#f07070}}
</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" class="ah"/></marker></defs>
<rect class="bg" x="1" y="1" width="858" height="358" rx="14"/>
<text class="t" x="32" y="44" font-size="20" font-weight="700">jobwatch 只推「新」的東西</text>
<text class="t m" x="32" y="68" font-size="13">每次抓完都跟上一次的清單比對，沒有變化就安靜</text>
<text class="t m" x="32" y="110" font-size="12" letter-spacing="1">上次抓到</text>
<rect class="box" x="32" y="122" width="200" height="40" rx="8"/><text class="t" x="50" y="147" font-size="13.5">職位 A</text>
<rect class="box" x="32" y="170" width="200" height="40" rx="8"/><text class="t" x="50" y="195" font-size="13.5">職位 B</text>
<rect class="box" x="32" y="218" width="200" height="40" rx="8"/><text class="t" x="50" y="243" font-size="13.5">職位 C</text>
<text class="t m" x="300" y="110" font-size="12" letter-spacing="1">今次抓到</text>
<rect class="box" x="300" y="122" width="200" height="40" rx="8"/><text class="t" x="318" y="147" font-size="13.5">職位 A</text><text class="t m" x="470" y="147" font-size="12" text-anchor="end">舊</text>
<rect class="box" x="300" y="170" width="200" height="40" rx="8"/><text class="t" x="318" y="195" font-size="13.5">職位 C</text><text class="t m" x="470" y="195" font-size="12" text-anchor="end">舊</text>
<rect class="okb" x="300" y="218" width="200" height="40" rx="8" stroke-width="1.6"/><text class="t" x="318" y="243" font-size="13.5" font-weight="700">職位 D</text><text class="t ok" x="482" y="243" font-size="12" font-weight="700" text-anchor="end">新！</text>
<text class="t m" x="300" y="290" font-size="12">職位 B 下架了：不通知</text>
<path class="ln" d="M236 190H296" marker-end="url(#a)"/>
<text class="t m" x="266" y="180" font-size="11.5" text-anchor="middle">比對</text>
<path class="ln" d="M504 238H578" marker-end="url(#a)"/>
<!-- phone notification -->
<rect class="box" x="584" y="112" width="244" height="200" rx="22"/>
<rect class="bg" x="600" y="176" width="212" height="76" rx="12"/>
<circle cx="622" cy="198" r="10" class="acc" stroke-width="1.4"/>
<text class="t" x="640" y="203" font-size="13" font-weight="700">我的 bot</text>
<text class="t m" x="798" y="203" font-size="11" text-anchor="end">現在</text>
<text class="t" x="612" y="234" font-size="13">新職位：職位 D</text>
<text class="t m" x="706" y="142" font-size="12" text-anchor="middle">Telegram</text>
<text class="t m" x="706" y="290" font-size="11.5" text-anchor="middle">不用再逐個網站刷</text>
</svg>
