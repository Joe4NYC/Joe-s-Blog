<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 400" role="img" aria-label="為什麼 Canvas 的 .ics 會漏死線：日期只寫在 PDF 講義時，只有 canvaswatch 掃得到" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>
.bg{fill:#ffffff;stroke:#e5e5e5}.t{fill:#1f2330;font-family:"PingFang TC","Noto Sans TC","Noto Sans CJK TC","Microsoft JhengHei",sans-serif}
.m{fill:#6b7080}.box{fill:#f4f5f6;stroke:#d9dbe0}.acc{fill:#eef0ff;stroke:#2337ff}.at{fill:#2337ff}.ln{stroke:#9aa0ad;fill:none;stroke-width:1.6}
.ok{fill:#1a8f5a}.bad{fill:#d14343}.okb{fill:#e8f6ef;stroke:#1a8f5a}.badb{fill:#fdeeee;stroke:#d14343}.ah{fill:#9aa0ad}
@media (prefers-color-scheme:dark){.bg{fill:#161822;stroke:#2d3244}.t{fill:#e6e8ef}.m{fill:#8b8fa0}.box{fill:#1f2230;stroke:#3d4253}.acc{fill:#1d2140;stroke:#7b8cff}.at{fill:#7b8cff}.ln{stroke:#5d6375}.ah{fill:#5d6375}.okb{fill:#13261d}.badb{fill:#2a1617}.ok{fill:#3fbf84}.bad{fill:#f07070}}
</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" class="ah"/></marker></defs>
<rect class="bg" x="1" y="1" width="858" height="398" rx="14"/>
<text class="t" x="32" y="44" font-size="20" font-weight="700">為什麼 .ics 會漏死線</text>
<text class="t m" x="32" y="68" font-size="13">示意：老師在 Canvas 設了日期的，.ics 抓得到；只寫在 PDF 裡的，它看不見</text>
<!-- row 1 -->
<rect class="box" x="32" y="100" width="250" height="104" rx="10"/>
<text class="t m" x="50" y="126" font-size="12" letter-spacing="1">CANVAS 作業</text>
<text class="t" x="50" y="154" font-size="15" font-weight="600">Assignment 1</text>
<text class="t m" x="50" y="180" font-size="12.5">截止日期欄：已填</text>
<!-- row 2 PDF -->
<rect class="box" x="32" y="236" width="250" height="132" rx="10"/>
<path class="bg" d="M50 252h150l22 22v78H50z"/>
<path class="ln" d="M200 252v22h22"/>
<text class="t m" x="62" y="274" font-size="11" font-weight="700">PDF · Week 3 slides</text>
<rect x="62" y="286" width="120" height="6" rx="3" class="box"/>
<rect x="62" y="300" width="100" height="6" rx="3" class="box"/>
<text class="t" x="62" y="330" font-size="12.5" font-weight="700">Quiz 1: 15 Oct</text>
<rect x="62" y="338" width="88" height="6" rx="3" class="box"/>
<!-- .ics column -->
<text class="t m" x="400" y="92" font-size="12" letter-spacing="1" text-anchor="middle">只靠 .ics 訂閱</text>
<rect class="okb" x="330" y="122" width="140" height="60" rx="10" stroke-width="1.4"/>
<text class="t ok" x="400" y="158" font-size="15" font-weight="700" text-anchor="middle">✓ 有</text>
<rect class="badb" x="330" y="272" width="140" height="60" rx="10" stroke-width="1.4"/>
<text class="t bad" x="400" y="308" font-size="15" font-weight="700" text-anchor="middle">✗ 漏了</text>
<!-- canvaswatch column -->
<text class="t m" x="620" y="92" font-size="12" letter-spacing="1" text-anchor="middle">用 canvaswatch</text>
<rect class="okb" x="550" y="122" width="140" height="60" rx="10" stroke-width="1.4"/>
<text class="t ok" x="620" y="158" font-size="15" font-weight="700" text-anchor="middle">✓ 有</text>
<rect class="okb" x="550" y="272" width="140" height="60" rx="10" stroke-width="1.4"/>
<text class="t ok" x="620" y="300" font-size="15" font-weight="700" text-anchor="middle">✓ 抓到</text>
<text class="t m" x="620" y="320" font-size="11" text-anchor="middle">規則比對文字裡的日期</text>
<!-- dashboard -->
<rect class="acc" x="730" y="182" width="104" height="100" rx="12" stroke-width="1.4"/>
<text class="t at" x="782" y="226" font-size="14" font-weight="700" text-anchor="middle">儀表板</text>
<text class="t m" x="782" y="248" font-size="11" text-anchor="middle">未來 30 日</text>
<path class="ln" d="M300 152H316M300 302H316" stroke-dasharray="2 4"/>
<path class="ln" d="M510 106V360" stroke-dasharray="3 5"/>
<path class="ln" d="M690 152H710V214H726" marker-end="url(#a)"/>
<path class="ln" d="M690 302H710V250H726" marker-end="url(#a)"/>
</svg>
