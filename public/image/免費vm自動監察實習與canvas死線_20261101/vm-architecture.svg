<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 440" role="img" aria-label="架構圖：一部 Oracle Cloud VM 上跑 jobwatch 和 canvaswatch，分別推送到 Telegram 和私人儀表板" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>
.bg{fill:#ffffff;stroke:#e5e5e5}.t{fill:#1f2330;font-family:"PingFang TC","Noto Sans TC","Noto Sans CJK TC","Microsoft JhengHei",sans-serif}
.m{fill:#6b7080}.box{fill:#f4f5f6;stroke:#d9dbe0}.acc{fill:#eef0ff;stroke:#2337ff}.at{fill:#2337ff}.ln{stroke:#9aa0ad;fill:none;stroke-width:1.6}
.ok{fill:#1a8f5a}.bad{fill:#d14343}.okb{fill:#e8f6ef;stroke:#1a8f5a}.badb{fill:#fdeeee;stroke:#d14343}.ah{fill:#9aa0ad}
@media (prefers-color-scheme:dark){.bg{fill:#161822;stroke:#2d3244}.t{fill:#e6e8ef}.m{fill:#8b8fa0}.box{fill:#1f2230;stroke:#3d4253}.acc{fill:#1d2140;stroke:#7b8cff}.at{fill:#7b8cff}.ln{stroke:#5d6375}.ah{fill:#5d6375}.okb{fill:#13261d}.badb{fill:#2a1617}.ok{fill:#3fbf84}.bad{fill:#f07070}}
</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" class="ah"/></marker></defs>
<rect class="bg" x="1" y="1" width="858" height="438" rx="14"/>
<text class="t" x="32" y="44" font-size="20" font-weight="700">一部 VM，兩個看門口的程式</text>
<text class="t m" x="32" y="68" font-size="13">左邊是要定時看的網頁，右邊是我真正會看的地方</text>
<!-- sources -->
<text class="t m" x="32" y="112" font-size="12" letter-spacing="1">要看的網頁</text>
<rect class="box" x="32" y="124" width="200" height="92" rx="10"/>
<text class="t" x="50" y="156" font-size="15" font-weight="600">實習招聘頁</text>
<text class="t m" x="50" y="180" font-size="12.5">本地／亞洲銀行、外資投行</text>
<text class="t m" x="50" y="198" font-size="12.5">金融監管機構</text>
<rect class="box" x="32" y="262" width="200" height="92" rx="10"/>
<text class="t" x="50" y="294" font-size="15" font-weight="600">Canvas 各科內容</text>
<text class="t m" x="50" y="318" font-size="12.5">課程頁面</text>
<text class="t m" x="50" y="336" font-size="12.5">PDF 講義（死線藏在這裡）</text>
<!-- VM -->
<rect class="acc" x="296" y="100" width="268" height="300" rx="14" stroke-width="1.6" stroke-dasharray="6 4"/>
<text class="t at" x="314" y="128" font-size="14" font-weight="700">Oracle Cloud VM</text>
<text class="t m" x="314" y="148" font-size="12">新加坡 · A1 · Always Free</text>
<rect class="box" x="314" y="166" width="232" height="74" rx="10"/>
<text class="t" x="332" y="196" font-size="15" font-weight="700">jobwatch</text>
<text class="t m" x="332" y="220" font-size="12.5">定時抓職位 → 跟上次比對</text>
<rect class="box" x="314" y="262" width="232" height="92" rx="10"/>
<text class="t" x="332" y="292" font-size="15" font-weight="700">canvaswatch</text>
<text class="t m" x="332" y="316" font-size="12.5">每日 08:00／20:00</text>
<text class="t m" x="332" y="334" font-size="12.5">規則式抽日期，不用 AI</text>
<text class="t m" x="314" y="384" font-size="11.5">預算提醒：超出免費額度就通知</text>
<!-- outputs -->
<text class="t m" x="628" y="112" font-size="12" letter-spacing="1">我會看的地方</text>
<rect class="box" x="628" y="124" width="200" height="92" rx="10"/>
<text class="t" x="646" y="156" font-size="15" font-weight="600">Telegram bot</text>
<text class="t m" x="646" y="180" font-size="12.5">有新職位才推到手機</text>
<rect class="box" x="628" y="262" width="200" height="92" rx="10"/>
<text class="t" x="646" y="294" font-size="15" font-weight="600">私人儀表板</text>
<text class="t m" x="646" y="318" font-size="12.5">死線跟其他待辦</text>
<text class="t m" x="646" y="336" font-size="12.5">排在同一個畫面</text>
<!-- arrows -->
<path class="ln" d="M232 170H312" marker-end="url(#a)"/>
<path class="ln" d="M232 308H312" marker-end="url(#a)"/>
<path class="ln" d="M546 203H587V170H626" marker-end="url(#a)"/>
<path class="ln" d="M546 308H626" marker-end="url(#a)"/>
</svg>
