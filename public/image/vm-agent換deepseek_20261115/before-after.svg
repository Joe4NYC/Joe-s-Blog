<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 430" role="img" aria-label="架構對比圖：之前 VM 上的 Claude Code 登入帳號、經 Telegram bot 接指令並替 jobwatch 打標籤；之後 VM 上跑 DeepSeek Harness 和 jobwatch，各用一條獨立的 DeepSeek API key，VM 的改動由 Mac 上的 Claude Code 執行，API key 由我手動寫入">
<style>
.bg{fill:#ffffff;stroke:#e5e5e5}.t{fill:#1f2330;font-family:"PingFang TC","Noto Sans TC","Noto Sans CJK TC","Microsoft JhengHei",sans-serif}
.m{fill:#6b7080}.box{fill:#f4f5f6;stroke:#d9dbe0}.acc{fill:#eef0ff;stroke:#2337ff}.at{fill:#2337ff}.ln{stroke:#9aa0ad;fill:none;stroke-width:1.6}
.ok{fill:#1a8f5a}.bad{fill:#d14343}.okb{fill:#e8f6ef;stroke:#1a8f5a}.badb{fill:#fdeeee;stroke:#d14343}.ah{fill:#9aa0ad}
@media (prefers-color-scheme:dark){.bg{fill:#161822;stroke:#2d3244}.t{fill:#e6e8ef}.m{fill:#8b8fa0}.box{fill:#1f2230;stroke:#3d4253}.acc{fill:#1d2140;stroke:#7b8cff}.at{fill:#7b8cff}.ln{stroke:#5d6375}.ah{fill:#5d6375}.okb{fill:#13261d}.badb{fill:#2a1617}.ok{fill:#3fbf84}.bad{fill:#f07070}}
</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" class="ah"/></marker></defs>
<rect class="bg" x="1" y="1" width="858" height="428" rx="14"/>
<text class="t" x="32" y="44" font-size="20" font-weight="700">VM 上的 agent：換之前與換之後</text>
<text class="t m" x="32" y="68" font-size="13">登入帳號的 Claude Code 撤下，改用 DeepSeek API key</text>
<rect class="box" x="32" y="88" width="388" height="330" rx="10"/>
<rect class="box" x="440" y="88" width="388" height="330" rx="10"/>
<text class="t" x="52" y="116" font-size="16" text-anchor="start" font-weight="700">之前</text>
<text class="t" x="460" y="116" font-size="16" text-anchor="start" font-weight="700">之後</text>
<rect class="bg" x="86" y="136" width="280" height="44" rx="10"/>
<text class="t" x="226" y="163" font-size="14" text-anchor="middle">Telegram bot（接指令）</text>
<path class="ln" d="M226 180L226 204" marker-end="url(#a)"/>
<rect class="badb" x="86" y="208" width="280" height="52" rx="10"/>
<text class="t" x="226" y="230" font-size="15" text-anchor="middle" font-weight="600">Claude Code</text>
<text class="t bad" x="226" y="250" font-size="12.5" text-anchor="middle">登入我的帳號</text>
<path class="ln" d="M226 260L226 284" marker-end="url(#a)"/>
<rect class="bg" x="86" y="288" width="280" height="44" rx="10"/>
<text class="t" x="226" y="315" font-size="14" text-anchor="middle">替 jobwatch 打標籤</text>
<text class="t m" x="226" y="362" font-size="13" text-anchor="middle">VM 上的設定和程式也由它自己改</text>
<text class="t bad" x="226" y="388" font-size="12.5" text-anchor="middle">現況：已登出，bot 已刪除</text>
<rect class="bg" x="474" y="136" width="320" height="44" rx="10"/>
<text class="t" x="634" y="163" font-size="14" text-anchor="middle">Mac 上的 Claude Code 負責改 VM</text>
<path class="ln" d="M634 180L634 204" marker-end="url(#a)"/>
<rect class="acc" x="474" y="208" width="320" height="124" rx="10"/>
<text class="t at" x="488" y="228" font-size="13" text-anchor="start" font-weight="700">VM</text>
<text class="t m" x="780" y="228" font-size="12.5" text-anchor="end">API key 由我手動寫入</text>
<rect class="bg" x="488" y="240" width="140" height="80" rx="10"/>
<text class="t" x="558" y="264" font-size="14" text-anchor="middle" font-weight="600">DeepSeek</text>
<text class="t" x="558" y="283" font-size="13" text-anchor="middle">Harness（dsh）</text>
<text class="t m" x="558" y="306" font-size="12.5" text-anchor="middle">獨立 key</text>
<rect class="bg" x="640" y="240" width="140" height="80" rx="10"/>
<text class="t" x="710" y="264" font-size="14" text-anchor="middle" font-weight="600">jobwatch</text>
<text class="t" x="710" y="283" font-size="13" text-anchor="middle">自動打標籤</text>
<text class="t m" x="710" y="306" font-size="12.5" text-anchor="middle">獨立 key</text>
<path class="ln" d="M634 332L634 358" marker-end="url(#a)"/>
<rect class="okb" x="474" y="360" width="320" height="44" rx="10"/>
<text class="t ok" x="634" y="387" font-size="13.5" text-anchor="middle">DeepSeek API（deepseek v4.1 flash）</text>
