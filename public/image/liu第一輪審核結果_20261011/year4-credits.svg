<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 380" role="img" aria-label="橫條圖：原本 Year 4 上學期 12、下學期 10 學分；現在上學期 12、下學期 13 學分；虛線標示每學期最少 9 學分" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>
.bg{fill:#ffffff;stroke:#e5e5e5}.t{fill:#1f2330;font-family:"PingFang TC","Noto Sans TC","Noto Sans CJK TC","Microsoft JhengHei",sans-serif}
.mono{font-family:"SFMono-Regular",Menlo,Consolas,"Noto Sans Mono","Noto Sans CJK TC",monospace}
.m{fill:#6b7080}.box{fill:#f4f5f6;stroke:#d9dbe0}.acc{fill:#eef0ff;stroke:#2337ff}.at{fill:#2337ff}.ln{stroke:#9aa0ad;fill:none;stroke-width:1.6}
.ok{fill:#1a8f5a}.bad{fill:#d14343}.okb{fill:#e8f6ef;stroke:#1a8f5a}.badb{fill:#fdeeee;stroke:#d14343}.ah{fill:#9aa0ad}
.dim{fill:#1f2330;opacity:.55}.bar{fill:#2337ff}.bar2{fill:#9aa6ff}.lnb{stroke:#d14343;fill:none;stroke-width:1.6}
@media (prefers-color-scheme:dark){.bg{fill:#161822;stroke:#2d3244}.t{fill:#e6e8ef}.m{fill:#8b8fa0}.box{fill:#1f2230;stroke:#3d4253}.acc{fill:#1d2140;stroke:#7b8cff}.at{fill:#7b8cff}.ln{stroke:#5d6375}.ah{fill:#5d6375}.okb{fill:#13261d}.badb{fill:#2a1617}.ok{fill:#3fbf84}.bad{fill:#f07070}.dim{fill:#000;opacity:.6}.bar{fill:#7b8cff}.bar2{fill:#3d4a99}.lnb{stroke:#f07070}}
</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" class="ah"/></marker></defs>
<rect class="bg" x="1" y="1" width="858" height="378" rx="14"/>
<text class="t" x="32" y="44" font-size="20" font-weight="700">Year 4 多了一科，反而更鬆</text>
<text class="t m" x="32" y="68" font-size="13">每學期最少要註冊 9 學分；下學期由 10 學分變 13 學分，退一科也不會跌穿下限</text>
<text class="t" x="186" y="134" font-size="13" text-anchor="end">原本 · 上學期</text>
<rect class="bar2" x="200" y="112" width="432" height="34" rx="6" stroke="none"/>
<text class="t" x="642" y="135" font-size="13" font-weight="700">12 學分</text>
<text class="t" x="186" y="188" font-size="13" text-anchor="end">原本 · 下學期</text>
<rect class="bar2" x="200" y="166" width="360" height="34" rx="6" stroke="none"/>
<text class="t" x="570" y="189" font-size="13" font-weight="700">10 學分</text>
<text class="t" x="186" y="256" font-size="13" text-anchor="end">現在 · 上學期</text>
<rect class="bar" x="200" y="234" width="432" height="34" rx="6" stroke="none"/>
<text class="t" x="642" y="257" font-size="13" font-weight="700">12 學分</text>
<text class="t" x="186" y="310" font-size="13" font-weight="700" text-anchor="end">現在 · 下學期</text>
<rect class="bar" x="200" y="288" width="468" height="34" rx="6" stroke="none"/>
<text class="t" x="678" y="311" font-size="13" font-weight="700">13 學分</text>
<path class="lnb" d="M524 100V350" stroke-dasharray="5 4"/>
<text class="t bad" x="518" y="364" font-size="12" font-weight="700" text-anchor="end">9 學分下限</text>
<text class="t at" x="790" y="150" font-size="16" font-weight="700" text-anchor="middle">22 → 25</text>
<text class="t m" x="790" y="172" font-size="12" text-anchor="middle">全年學分</text>
</svg>
