<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 450" role="img" aria-label="示意圖：兩科 15 ECTS 的地基 751G34 和 754G52 合共 30 ECTS，達到居留許可下限；上蓋 723G73 7.5 ECTS 未獲收" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>
.bg{fill:#ffffff;stroke:#e5e5e5}.t{fill:#1f2330;font-family:"PingFang TC","Noto Sans TC","Noto Sans CJK TC","Microsoft JhengHei",sans-serif}
.mono{font-family:"SFMono-Regular",Menlo,Consolas,"Noto Sans Mono","Noto Sans CJK TC",monospace}
.m{fill:#6b7080}.box{fill:#f4f5f6;stroke:#d9dbe0}.acc{fill:#eef0ff;stroke:#2337ff}.at{fill:#2337ff}.ln{stroke:#9aa0ad;fill:none;stroke-width:1.6}
.ok{fill:#1a8f5a}.bad{fill:#d14343}.okb{fill:#e8f6ef;stroke:#1a8f5a}.badb{fill:#fdeeee;stroke:#d14343}.ah{fill:#9aa0ad}
.dim{fill:#1f2330;opacity:.55}.bar{fill:#2337ff}.bar2{fill:#9aa6ff}.lnb{stroke:#d14343;fill:none;stroke-width:1.6}
@media (prefers-color-scheme:dark){.bg{fill:#161822;stroke:#2d3244}.t{fill:#e6e8ef}.m{fill:#8b8fa0}.box{fill:#1f2230;stroke:#3d4253}.acc{fill:#1d2140;stroke:#7b8cff}.at{fill:#7b8cff}.ln{stroke:#5d6375}.ah{fill:#5d6375}.okb{fill:#13261d}.badb{fill:#2a1617}.ok{fill:#3fbf84}.bad{fill:#f07070}.dim{fill:#000;opacity:.6}.bar{fill:#7b8cff}.bar2{fill:#3d4a99}.lnb{stroke:#f07070}}
</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" class="ah"/></marker></defs>
<rect class="bg" x="1" y="1" width="858" height="448" rx="14"/>
<text class="t" x="32" y="44" font-size="20" font-weight="700">「地基＋上蓋」：上蓋沒批，房子沒塌</text>
<text class="t m" x="32" y="68" font-size="13">兩科地基獨力撐起 30 ECTS，剛好守住居留許可的下限</text>
<rect class="badb" x="92" y="104" width="360" height="82" rx="10" stroke-width="1.6" stroke-dasharray="6 4"/>
<text class="t bad" x="272" y="134" font-size="13.5" font-weight="700" text-anchor="middle">723G73 Project Management · 7.5 ECTS</text>
<text class="t m" x="272" y="158" font-size="12" text-anchor="middle">上蓋：要求 60 ECTS Business Administration</text>
<text class="t bad" x="272" y="176" font-size="12" font-weight="700" text-anchor="middle">第一輪未獲收</text>
<path class="lnb" d="M60 222H500" stroke-dasharray="5 4"/>
<text class="t bad" x="500" y="214" font-size="12" font-weight="700" text-anchor="end">30 ECTS：居留許可最低要求</text>
<rect class="okb" x="92" y="232" width="176" height="150" rx="10" stroke-width="1.4"/>
<text class="t ok mono" x="180" y="272" font-size="16" font-weight="700" text-anchor="middle">751G34</text>
<text class="t m" x="180" y="296" font-size="12" text-anchor="middle">Sweden and the Swedes</text>
<text class="t" x="180" y="336" font-size="22" font-weight="700" text-anchor="middle">15 ECTS</text>
<text class="t ok" x="180" y="362" font-size="12" font-weight="700" text-anchor="middle">地基</text>
<rect class="okb" x="276" y="232" width="176" height="150" rx="10" stroke-width="1.4"/>
<text class="t ok mono" x="364" y="272" font-size="16" font-weight="700" text-anchor="middle">754G52</text>
<text class="t m" x="364" y="296" font-size="12" text-anchor="middle">Nordic Culture</text>
<text class="t" x="364" y="336" font-size="22" font-weight="700" text-anchor="middle">15 ECTS</text>
<text class="t ok" x="364" y="362" font-size="12" font-weight="700" text-anchor="middle">地基</text>
<text class="t m" x="272" y="412" font-size="12" text-anchor="middle">先修只要求 60 ECTS 任何學科＋英文</text>
<rect class="box" x="540" y="118" width="288" height="58" rx="10" />
<text class="t at" x="558" y="142" font-size="12" font-weight="700">簽證</text>
<text class="t" x="558" y="162" font-size="12.5">仍有 30 ECTS，居留許可不受影響</text>
<rect class="box" x="540" y="190" width="288" height="58" rx="10" />
<text class="t at" x="558" y="214" font-size="12" font-weight="700">PolyU</text>
<text class="t" x="558" y="234" font-size="12.5">兩科本來就在 AR41a 名單，不用重新審批</text>
<rect class="box" x="540" y="262" width="288" height="58" rx="10" />
<text class="t at" x="558" y="286" font-size="12" font-weight="700">學分</text>
<text class="t" x="558" y="306" font-size="12.5">12 學分照樣填滿 Free Elective 上限</text>
<rect class="box" x="540" y="334" width="288" height="58" rx="10" />
<text class="t at" x="558" y="358" font-size="12" font-weight="700">代價</text>
<text class="t" x="558" y="378" font-size="12.5">COMP3235 搬回 Year 4 修</text>
</svg>
