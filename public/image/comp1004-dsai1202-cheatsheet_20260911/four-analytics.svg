<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 380" role="img" aria-label="階梯圖：Descriptive 發生了什麼、Diagnostic 為什麼、Predictive 將會怎樣、Prescriptive 該怎麼做，四級逐級上升" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>
