</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" class="ah"/></marker></defs>
<rect class="bg" x="1" y="1" width="858" height="398" rx="14"/>
<text class="t" x="32" y="44" font-size="20" font-weight="700">我的 Claude 使用報告：兩組最刺眼的數字</text>
<text class="t m" x="32" y="68" font-size="13">只計 claude.ai 有內容的 266 個對話（2026 年 11 月 4 日）</text>
<rect class="box" x="32" y="90" width="380" height="286" rx="10"/>
<text class="t" x="52" y="120" font-size="15" font-weight="700">以理解為目的的提問比例</text>
<line class="ln" x1="72" y1="330" x2="372" y2="330"/>
<rect class="box" x="110" y="150" width="90" height="180" rx="4" stroke-width="1.5"/>
<text class="t" x="155" y="140" font-size="15" font-weight="700" text-anchor="middle">19.6%</text>
<rect class="acc" x="250" y="278" width="90" height="52" rx="4" stroke-width="1.5"/>
<text class="t at" x="295" y="268" font-size="15" font-weight="700" text-anchor="middle">5.7%</text>
<text class="t m" x="155" y="352" font-size="13" text-anchor="middle">2024–25 年</text>
<text class="t m" x="295" y="352" font-size="13" text-anchor="middle">2026 年</text>
<rect class="box" x="448" y="90" width="380" height="286" rx="10"/>
<text class="t" x="468" y="120" font-size="15" font-weight="700">1,210 則追問裡的其中三類</text>
<text class="t" x="468" y="160" font-size="13.5">「好」「繼續」這類推進語</text>
