<rect class="acc" x="468" y="240" width="44" height="22" rx="4"/>
<text class="t at" x="520" y="256" font-size="13.5" font-weight="700">37</text>
<text class="t" x="468" y="300" font-size="13.5">深挖原理</text>
<rect class="acc" x="468" y="310" width="3" height="22" rx="1"/>
<text class="t at" x="480" y="326" font-size="13.5" font-weight="700">2</text>
<text class="t m" x="468" y="360" font-size="12.5">長度按則數比例畫</text>
